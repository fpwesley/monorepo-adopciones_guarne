<div class="espacioMargen"></div>

<!-- FILTROS -->
<section class="filtro-mascotas mb-5 mt-4">
  <div class="container">
    <div class="row justify-content-center bg-light p-4 rounded-3 shadow-sm border">
      <h3 class="mb-4 text-center" style="color: #1a4a2b;">Encuentra a tu compañero ideal</h3>

      <div class="col-md-4 mb-3">
        <label class="fw-bold mb-2" style="color: #1a4a2b;">Especie</label>
        <select class="form-select border-success shadow-sm" [value]="filtroEspecie()" (change)="setEspecie($any($event.target).value)">
          <option value="todos">🐾 Todos</option>
          <option value="perro">🐶 Perros</option>
          <option value="gato">🐱 Gatos</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="fw-bold mb-2" style="color: #1a4a2b;">Tamaño</label>
        <select class="form-select border-success shadow-sm" [value]="filtroTamano()" (change)="setTamano($any($event.target).value)">
          <option value="todos">Todos</option>
          <option value="pequeno">Pequeño</option>
          <option value="mediano">Mediano</option>
          <option value="grande">Grande</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="fw-bold mb-2" style="color: #1a4a2b;">Sexo</label>
        <select class="form-select border-success shadow-sm" [value]="filtroSexo()" (change)="setSexo($any($event.target).value)">
          <option value="todos">⚥ Todos</option>
          <option value="macho">Macho</option>
          <option value="hembra">Hembra</option>
        </select>
      </div>
    </div>
  </div>
</section>

<!-- TARJETAS -->
<div class="container mb-5">
  <div class="row">
    <div *ngIf="animalesFiltrados().length === 0" class="col-12 text-center py-5">
      <i class="bi bi-emoji-frown" style="font-size:3rem; color:#ccc;"></i>
      <p class="mt-3 text-muted">No hay mascotas que coincidan con los filtros seleccionados.</p>
    </div>

    <div *ngFor="let animal of animalesFiltrados()" class="col-md-4 mb-4 tarjeta-animal">
      <div class="card">
        <img [src]="animal.imagen" class="card-img-top" [alt]="animal.nombre">
        <div class="card-body">
          <p class="card-text">
            <strong>Nombre:</strong> {{ animal.nombre }}<br>
            <strong>Sexo:</strong> {{ animal.sexo }}<br>
            <strong>Raza:</strong> {{ animal.raza }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="espacioMargen"></div>
