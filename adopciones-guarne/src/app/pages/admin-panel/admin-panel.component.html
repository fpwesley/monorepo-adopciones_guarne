<!-- Navbar propio del admin -->
<nav class="navbar navbar-expand-lg bg-custom" style="position: sticky; top: 0; z-index: 1030;">
  <div class="container-fluid">
    <div class="d-flex align-items-center">
      <img src="assets/img/icon.ico" height="50" alt="Logo">
      <h1 class="navbar-brand navfont mb-0">&nbsp;&nbsp;&nbsp;Panel Administrativo</h1>
    </div>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <button class="btn btn-link nav-link text-white" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
        </button>
      </li>
    </ul>
  </div>
</nav>

<div class="admin-welcome">
  <h2 style="color: var(--verde);">Bienvenido al Panel</h2>
  <p class="text-muted">Gestiona el contenido de Adopciones Guarne desde aquí.</p>
</div>

<div class="container pb-5">
  <div class="row g-4">
    <div *ngFor="let t of tarjetas" class="col-md-6 col-lg-3">
      <div class="admin-card">
        <div class="admin-icon"><i [class]="'bi ' + t.icono"></i></div>
        <h5 style="color: var(--verde); font-weight: 700;">{{ t.titulo }}</h5>
        <p class="text-muted" style="font-size: 0.9rem;">{{ t.descripcion }}</p>
        <button class="btn btn-outline-success btn-sm mt-2">Gestionar</button>
      </div>
    </div>
  </div>
</div>
